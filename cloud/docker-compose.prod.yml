name: edufocus-cloud-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${CLOUD_API_IMAGE:-edufocus-cloud-api:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      EDUFOCUS_CLOUD_PUBLIC_URL: ${EDUFOCUS_CLOUD_PUBLIC_URL:?set EDUFOCUS_CLOUD_PUBLIC_URL in .env}
      EDUFOCUS_CLOUD_AUTO_MIGRATE: "false"
      Cloud__TrustForwardedHeaders: "true"
      Push__Enabled: ${PUSH_ENABLED:-false}
      Push__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Push__ServiceAccountPath: /run/secrets/firebase-service-account.json
      Push__PollSeconds: ${PUSH_POLL_SECONDS:-60}
      Jobs__Enabled: ${JOBS_ENABLED:-true}
      Jobs__IntervalSeconds: ${JOBS_INTERVAL_SECONDS:-60}
      Jobs__PairingSessionHours: ${JOBS_PAIRING_SESSION_HOURS:-24}
      Jobs__SyncEventDays: ${JOBS_SYNC_EVENT_DAYS:-7}
      Jobs__NotificationDays: ${JOBS_NOTIFICATION_DAYS:-30}
      Jobs__DailySummaryDays: ${JOBS_DAILY_SUMMARY_DAYS:-180}
      Jobs__CloudAuditDays: ${JOBS_CLOUD_AUDIT_DAYS:-365}
      Jobs__SoftDeletedFamilyDays: ${JOBS_SOFT_DELETED_FAMILY_DAYS:-30}
      RateLimiting__PairingCreatePerHour: ${RATE_LIMIT_PAIRING_CREATE_PER_HOUR:-10}
      RateLimiting__PairingClaimPerHour: ${RATE_LIMIT_PAIRING_CLAIM_PER_HOUR:-20}
      RateLimiting__RequestsPerMinute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RateLimiting__SyncRequestsPerMinute: ${RATE_LIMIT_SYNC_REQUESTS_PER_MINUTE:-60}
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "dotnet", "EduFocus.Cloud.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      EDUFOCUS_DOMAIN: ${EDUFOCUS_DOMAIN:?set EDUFOCUS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
