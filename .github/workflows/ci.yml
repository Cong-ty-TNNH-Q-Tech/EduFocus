name: EduFocus CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EduFocus — Build & Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore EduFocus.slnx

      - name: Build (Release)
        run: dotnet build EduFocus.slnx --no-restore --configuration Release

      - name: Test (unit + SQLite integration)
        run: >
          dotnet test EduFocus.slnx
          --no-build
          --configuration Release
          --verbosity minimal
          --logger trx
          --results-directory "${{ github.workspace }}/artifacts/test-results"

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/EduFocus.WPF/EduFocus.WPF.csproj
          --configuration Release
          --output "${{ github.workspace }}/artifacts/publish"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edufocus-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: edufocus-ci-publish
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 3
