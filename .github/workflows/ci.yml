name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EduFocus.slnx

      - name: Build
        run: dotnet build EduFocus.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EduFocus.slnx --no-build --configuration Release --verbosity minimal
