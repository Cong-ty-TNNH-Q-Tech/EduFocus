name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to build (e.g. 2.1.0 or 2.1.0-rc.1)"
        required: true
        type: string
      dry_run:
        description: "Build, sign and upload artifacts without touching a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CLOUD_RELAY_BASE_URL: ${{ vars.CLOUD_RELAY_BASE_URL }}

jobs:
  build:
    name: Build, sign and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      dry_run: ${{ steps.ver.outputs.dry_run }}
      commit: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          raw="$INPUT_VERSION"
          if [ -z "$raw" ]; then raw="$REF_NAME"; fi
          resolved="$(bash mobile/scripts/resolve-mobile-version.sh "$raw")"
          dry_run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            dry_run=true
          fi
          {
            printf '%s\n' "$resolved"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Mobile release resolved ($resolved, dry_run=$dry_run)"

      # The release cannot ship without a signing key.
      # Never echo secret values; only their names are reported.
      - name: Require release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "$(printenv "$name" || true)" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('mobile/**/*.csproj', 'cloud/EduFocus.Cloud.Contracts/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Run unit tests
        run: dotnet test mobile/EduFocus.Parent.Tests/EduFocus.Parent.Tests.csproj --configuration Release

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/edufocus-release.keystore"
          test -s "$RUNNER_TEMP/edufocus-release.keystore"

      - name: Publish signed APK and AAB
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          AndroidKeyStore: "true"
          AndroidSigningKeyStore: ${{ runner.temp }}/edufocus-release.keystore
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dotnet publish mobile/EduFocus.Parent.App/EduFocus.Parent.App.csproj \
            --configuration Release \
            --framework net10.0-android \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$CODE" \
            -p:CloudRelayBaseUrl="$CLOUD_RELAY_BASE_URL" \
            --output publish

      - name: Verify signature and package metadata
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          apk="$(find publish -maxdepth 1 -name '*-Signed.apk' -print -quit)"
          aab="$(find publish -maxdepth 1 -name '*-Signed.aab' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::The signed APK was not produced."
            exit 1
          fi

          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -n 1)"
          aapt2="$(dirname "$apksigner")/aapt2"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$("$aapt2" dump badging "$apk" | head -n 1)"
          echo "$badging"
          [[ "$badging" == *"name='com.qtech.edufocus.parent'"* ]] || {
            echo "::error::Unexpected package name in the APK."; exit 1; }
          [[ "$badging" == *"versionCode='$CODE'"* ]] || {
            echo "::error::versionCode does not match the tag."; exit 1; }
          [[ "$badging" == *"versionName='$VERSION'"* ]] || {
            echo "::error::versionName does not match the tag."; exit 1; }

          mkdir -p release-assets
          cp "$apk" "release-assets/EduFocus-Parent-Android-$VERSION.apk"
          if [ -n "$aab" ]; then
            cp "$aab" "release-assets/EduFocus-Parent-Android-$VERSION.aab"
          fi
          ( cd release-assets && sha256sum EduFocus-Parent-Android-* > SHA256SUMS.txt && cat SHA256SUMS.txt )

      # The keystore must never survive the job or reach an artifact.
      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/edufocus-release.keystore"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edufocus-parent-android-${{ steps.ver.outputs.version }}
          path: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EduFocus Phụ huynh ${{ steps.ver.outputs.version }}"
            echo ""
            echo "- Tag: \`${{ steps.ver.outputs.tag }}\`"
            echo "- versionCode: \`${{ steps.ver.outputs.code }}\`"
            echo "- Prerelease: \`${{ steps.ver.outputs.prerelease }}\`"
            echo "- Dry run: \`${{ steps.ver.outputs.dry_run }}\`"
            echo "- Artifacts: signed APK (and AAB when produced), SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Attach artifacts to GitHub Release
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: edufocus-parent-android-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TARGET_COMMIT: ${{ needs.build.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.apk release-assets/*.aab release-assets/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          existing_type="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.type' 2>/dev/null || true)"
          existing_sha="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ "$existing_type" = "tag" ]; then
            existing_sha="$(gh api "repos/${REPO}/git/tags/${existing_sha}" --jq '.object.sha')"
          fi
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$TARGET_COMMIT" ]; then
            echo "::error::Tag $TAG already exists on commit $existing_sha (expected $TARGET_COMMIT)."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease_flag=()
            if [ "$PRERELEASE" = "true" ]; then prerelease_flag=(--prerelease); fi
            if ! gh release create "$TAG" "${files[@]}" \
              --target "$TARGET_COMMIT" \
              --title "EduFocus $TAG" \
              --notes "EduFocus Phụ huynh cho Android. Cài đặt và kiểm tra SHA-256 theo hướng dẫn trong mobile/README.md." \
              "${prerelease_flag[@]}"
            then
              gh release upload "$TAG" "${files[@]}" --clobber
            fi
          fi
