name: Cloud CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore cloud/EduFocus.Cloud.slnx

      - name: Build
        run: dotnet build cloud/EduFocus.Cloud.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test cloud/EduFocus.Cloud.slnx --configuration Release --no-build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        working-directory: cloud
        env:
          EDUFOCUS_CLOUD_PUBLIC_URL: https://cloud.example.test
          EDUFOCUS_DOMAIN: cloud.example.test
        run: docker compose --profile tls config --quiet

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: cloud
          file: cloud/Dockerfile
          push: false
          load: true
          tags: edufocus-cloud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contains no secrets
        run: |
          if docker run --rm --entrypoint sh edufocus-cloud-api:ci -c 'find /app \( -name ".env" -o -name "*service-account*.json" -o -name "*.pfx" \)' | grep -q .; then
            echo "Secret-like file found inside the image." >&2
            exit 1
          fi

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        run: |
          tags="ghcr.io/cong-ty-tnnh-q-tech/edufocus-cloud-api:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/cong-ty-tnnh-q-tech/edufocus-cloud-api:${{ github.ref_name }}"
            if [[ "${{ github.ref_name }}" != *-* ]]; then
              tags="${tags}"$'\n'"ghcr.io/cong-ty-tnnh-q-tech/edufocus-cloud-api:latest"
            fi
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: cloud
          file: cloud/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
