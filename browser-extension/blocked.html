<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang bị chặn · EduFocus</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card" role="alert">
    <div class="mark" aria-hidden="true">E</div>
    <p class="eyebrow">EduFocus</p>
    <h1>Trang này đang bị chặn</h1>
    <p class="lead">
      Trang bạn vừa mở nằm trong danh sách chặn của phụ huynh.
      Hãy quay lại bài học, hoặc hỏi phụ huynh nếu bạn cần mở trang này.
    </p>
    <div class="actions">
      <button id="back" type="button" class="primary">Quay lại</button>
      <button id="close" type="button" class="secondary">Đóng tab</button>
    </div>
    <p class="footnote">Trang chặn không hiển thị địa chỉ bạn vừa mở.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
