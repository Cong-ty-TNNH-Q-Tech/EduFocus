<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduFocus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="mark" aria-hidden="true">E</div>
      <div>
        <p class="eyebrow">EduFocus</p>
        <h1>Bảo vệ trình duyệt</h1>
      </div>
    </header>

    <div class="status">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <span id="status-text">Đang kiểm tra…</span>
    </div>

    <p id="detail" class="detail"></p>
    <p class="hint">
      Chặn URL và đường dẫn chỉ hoạt động khi EduFocus đang mở và phiên học
      đang được bảo vệ. Khi EduFocus không chạy, trình duyệt hoạt động bình thường.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
